name: EventFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/thaianhvu29/eventflow

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMAGE:$GITHUB_SHA" .

      - name: Login to GHCR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish Docker image
        if: github.event_name == 'push'
        run: docker push "$IMAGE:$GITHUB_SHA"

  deploy:
    name: Deploy to Ubuntu
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, eventflow-deploy]
    timeout-minutes: 10

    permissions:
      contents: read
      packages: read

    concurrency:
      group: eventflow-production
      cancel-in-progress: false

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Pull and deploy tested image
        shell: bash
        run: |
          set -euo pipefail
          cd /home/thaianhvu/eventflow

          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT

          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          export DEPLOY_IMAGE="ghcr.io/thaianhvu29/eventflow:$GITHUB_SHA"
          export APP_VERSION="$GITHUB_SHA"

          docker compose -p eventflow \
            --env-file .env -f compose.deploy.yaml pull init web

          docker compose -p eventflow \
            --env-file .env -f compose.deploy.yaml \
            up -d --no-build --no-deps init

          init_id="$(docker compose -p eventflow \
            --env-file .env -f compose.deploy.yaml ps -aq init)"

          init_exit="$(docker wait "$init_id")"
          if [ "$init_exit" != "0" ]; then
            docker logs "$init_id"
            exit 1
          fi

          docker compose -p eventflow \
            --env-file .env -f compose.deploy.yaml \
            up -d --no-build --no-deps web

          port="$(docker compose -p eventflow \
            --env-file .env -f compose.deploy.yaml port web 8000)"
          port="${port##*:}"

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 \
              "http://127.0.0.1:$port/health/ready" >/dev/null; then
              if curl -fsS --max-time 3 \
                "http://127.0.0.1:$port/health/live" |
                python3 -c 'import json,os,sys; sys.exit(0 if json.load(sys.stdin)["version"] == os.environ["GITHUB_SHA"] else 1)'; then
                echo "Deploy thành công: $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 3
          done

          docker compose -p eventflow \
            --env-file .env -f compose.deploy.yaml logs --tail=80 web
          echo "Deploy chưa đạt health check."
          exit 1
